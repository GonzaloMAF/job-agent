server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Los archivos con hash en el nombre (Vite) pueden cachearse agresivamente
  location ~* \.(js|css|woff2?|svg|png|jpg|jpeg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Todo lo demás cae en index.html: React Router gestiona las rutas en el cliente
  location / {
    try_files $uri $uri/ /index.html;
  }
}
